<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minhas compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg custom-navbar position-relative">
            <div class="container position-relative">
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <img src="../images/logo.png" alt="Happy Game" height="40" />
                    <span class="logo-text ms-2">Happy Game</span>
                </a>

                <!-- Substituir o div antigo por este h2 com classe -->
                <h2 class="page-title">Minhas compras</h2>
            </div>
        </nav>
    </header>
    <main class="container my-5" style="max-width: 920px;">
        <article class="card-surface section-block">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="mb-0 fw-semibold">10/10/2025</p>
                <button class="btn-recomprar">Comprar novamente</button>
            </div>

            <div class="produto-card">
                <img src="../images/Teclado.3.png" alt="Teclado" class="produto-img" />
                <div>
                    <div class="d-flex gap-2 align-items-center mb-2">
                        <p class="mb-0">Entrega:</p>
                        <span class="entrega-estado entregue">Entregue</span>
                    </div>
                    <p class="mb-1">Teclado gamer mecânico RAZER</p>
                    <p class="mb-0">Quantidade: 1</p>
                </div>
            </div>
        </article>

        <article class="card-surface section-block">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="mb-0 fw-semibold">04/09/2025</p>
                <button class="btn-recomprar">Comprar novamente</button>
            </div>

            <div class="produto-card">
                <img src="../images/Cadeira.3.png" alt="Cadeira" class="produto-img" />
                <div>
                    <div class="d-flex gap-2 align-items-center mb-2">
                        <p class="mb-0">Entrega:</p>
                        <span class="entrega-estado pendente">Pendente</span>
                    </div>
                    <p class="mb-1">Cadeira ergonômica para Home Office</p>
                    <p class="mb-0">Quantidade: 1</p>
                </div>
            </div>
        </article>
    </main>

    <footer class="rodape mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <p class="mb-0">&copy; 2025 Cristian Gadelha, João Beraldo, Pedro Henrique</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <h5 class="sitemap-title mb-1">Mapa do Site</h5>
                    <ul class="sitemap-list mb-0">
                        <li><a href="../index.html">Início</a></li>
                        <li><a href="../pages/info.html">Informações</a></li>
                        <li><a href="../pages/form.html">Contato</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
