<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Happy Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.1);
            background-color: var(--cor-branca);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: var(--cor-rosa);
            border-radius: 10px;
        }

        .logo-container img {
            height: 40px;
            margin-right: 10px;
        }

        .logo-text {
            color: var(--cor-branca);
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-control {
            border-color: var(--cor-azul);
        }

        .form-control:focus {
            border-color: var(--cor-rosa);
            box-shadow: 0 0 0 0.25rem rgba(255, 42, 109, 0.25);
        }

        .btn-login {
            background-color: var(--cor-rosa);
            color: var(--cor-branca);
            border: none;
            padding: 0.8rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #e02460;
            color: var(--cor-branca);
        }

        .btn-cadastro {
            color: var(--cor-rosa);
            text-decoration: none;
            font-weight: 500;
        }

        .btn-cadastro:hover {
            color: #e02460;
        }

        .link-senha {
            color: var(--cor-azul);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .link-senha:hover {
            color: #04c0cc;
        }

        .error-message {
            color: var(--cor-rosa);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../images/logo.png" alt="Happy Game Logo">
                    <span class="logo-text">Happy Game</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1">
        <div class="login-container">
            <div class="text-center mb-3">
                <h3 class="mb-1">Faça login</h3>
                <p class="text-muted mb-3">Insira seu e-mail cadastrado</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                    <label for="email">E-mail</label>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                    <label for="senha">Senha</label>
                    <div class="error-message" id="senhaError"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="register.html" class="btn-cadastro">Cadastrar-se</a>
                    <a href="#" class="link-senha" data-bs-toggle="modal" data-bs-target="#recuperarSenhaModal">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3">Entrar</button>
                
                <!-- Modal de Recuperação de Senha -->
                <div class="modal fade" id="recuperarSenhaModal" tabindex="-1" aria-labelledby="recuperarSenhaModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="recuperarSenhaModalLabel">Recuperar Senha</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                            </div>
                            <div class="modal-body">
                                <form id="recuperarSenhaForm">
                                    <div class="mb-3">
                                        <label for="emailRecuperacao" class="form-label">Digite seu e-mail cadastrado</label>
                                        <input type="email" class="form-control" id="emailRecuperacao" required>
                                        <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" class="btn btn-login" onclick="enviarRecuperacao()">Enviar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
 
    <footer class="rodape mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2025 Cristian Gadelha, João Beraldo, Pedro Henrique</p>
        </div>
    </footer>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function enviarRecuperacao() {
            const emailRecuperacao = document.getElementById('emailRecuperacao');
            if (!emailRecuperacao.value || !emailRecuperacao.value.includes('@')) {
                emailRecuperacao.classList.add('is-invalid');
                return;
            }
           
         
            alert('Um link de recuperação foi enviado para seu e-mail.');
            const modal = bootstrap.Modal.getInstance(document.getElementById('recuperarSenhaModal'));
            modal.hide();
            emailRecuperacao.value = '';
            emailRecuperacao.classList.remove('is-invalid');
        }
 
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
           
           
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
           
            let isValid = true;
            const email = document.getElementById('email');
            const senha = document.getElementById('senha');
           
         
            if (!email.value.trim()) {
                document.getElementById('emailError').textContent = 'Por favor, insira seu e-mail ou telefone';
                document.getElementById('emailError').style.display = 'block';
                email.classList.add('is-invalid');
                isValid = false;
            }
           
          
            if (!senha.value) {
                document.getElementById('senhaError').textContent = 'Por favor, insira sua senha';
                document.getElementById('senhaError').style.display = 'block';
                senha.classList.add('is-invalid');
                isValid = false;
            }
           
            if (isValid) {
                window.location.href = '../index.html';
            }
        });
    </script>
 

</body>
</html>
