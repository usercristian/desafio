<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Happy Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../images/logo.png" alt="Happy Game Logo">
                    <span class="logo-text">Happy Game</span>
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Abrir navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html"> Voltar ao Início</a></li>
                    </ul>
                </div>
                </div>
        </nav>
    </header>

    <main class="container flex-grow-1">
        <div class="login-container">
            <div class="text-center mb-3">
                <h3 class="mb-1">Faça login</h3>
                <p class="text-muted mb-3">Insira seu e-mail cadastrado</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                    <label for="email">E-mail</label>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                    <label for="senha">Senha</label>
                    <div class="error-message" id="senhaError"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="register.html" class="btn-cadastro">Cadastrar-se</a>
                    <a href="#" class="link-senha" data-bs-toggle="modal" data-bs-target="#recuperarSenhaModal">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3">Entrar</button>
                
                <div class="modal fade" id="recuperarSenhaModal" tabindex="-1" aria-labelledby="recuperarSenhaModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="recuperarSenhaModalLabel">Recuperar Senha</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                            </div>
                            <div class="modal-body">
                                <form id="recuperarSenhaForm">
                                    <div class="mb-3">
                                        <label for="emailRecuperacao" class="form-label">Digite seu e-mail cadastrado</label>
                                        <input type="email" class="form-control" id="emailRecuperacao" required>
                                        <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" class="btn btn-login" onclick="enviarRecuperacao()">Enviar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
 
    <footer class="rodape mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2025 Cristian Gadelha, João Beraldo, Pedro Henrique</p>
        </div>
    </footer>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
 

</body>
</html>
