<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark custom-navbar">
          <div class="container">
            <a class="navbar-brand" href="../index.html">
  <img src="../images/logo.png" alt="Happy Game Logo">
  <span class="logo-text">Happy Game</span>
</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Abrir navegação">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
              <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="info.html">Informações</a></li>
                <li class="nav-item"><a class="nav-link" href="form.html">Contato</a></li>
              </ul>
            </div>
          </div>
        </nav>
            </div>
          </div>
        </nav>
    </header>

    <div class="divisoria container"> <h2 class="text-center mt-4">Fale Conosco</h2>
  <form id="contactForm" action="feedback.html" method="GET">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>

            <label for="email">Seu Melhor Email:</label>
            <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>

            <label for="assunto">Assunto (Resumo da Dúvida):</label>
            <input type="text" id="assunto" name="assunto" placeholder="Ex: Dúvida sobre entrega" required>

            <label for="mensagem">Detalhe sua Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite aqui sua dúvida, sugestão ou feedback." required></textarea>

      <button type="button" id="openConfirm" class="btn btn-primary">Enviar Mensagem</button>
        </form>
    </div>
    <div class="rodape">
        <p>Cristian Gadelha, João Beraldo, Pedro Henrique @ 2025</p>
    </div>

    
    <div class="modal fade" id="confirmEnviarModal" tabindex="-1" aria-labelledby="confirmEnviarLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmEnviarLabel">Mensagem Recebida com Sucesso!</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Obrigado por entrar em contato. Analisaremos sua solicitação e responderemos o mais breve possível.
          </div>
          <div class="modal-footer">
            <button type="button" id="confirmEnviar" class="btn btn-primary">Continuar navegando</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('openConfirm').addEventListener('click', function() {
        var myModal = new bootstrap.Modal(document.getElementById('confirmEnviarModal'));
        myModal.show();
      });

      document.getElementById('confirmEnviar').addEventListener('click', function() {
        window.location.href = '../index.html';
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
