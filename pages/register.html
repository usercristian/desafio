<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-se - Happy Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.1);
            background-color: var(--cor-branca);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            padding: 0.75rem;
        }

        .form-control:focus {
            border-color: var(--cor-rosa);
            box-shadow: 0 0 0 0.25rem rgba(255, 42, 109, 0.25);
        }

        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .btn-continuar {
            background-color: var(--cor-rosa);
            color: var(--cor-branca);
            border: none;
            padding: 0.8rem;
            font-weight: bold;
            width: 100%;
            border-radius: 8px;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .btn-continuar:hover {
            background-color: #e02460;
        }

        .terms-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 1rem;
        }

        .terms-text a {
            color: #007bff;
            text-decoration: none;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--cor-rosa);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .checkbox-wrapper input[type="checkbox"] {
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../images/logo.png" alt="Happy Game Logo">
                    <span class="logo-text">Happy Game</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1">
        <div class="register-container">
            <h2 class="text-center mb-4">Cadastre-se</h2>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="exemplo@email.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+55" required>
                    <div class="text-muted small">DDD + número</div>
                    <div class="error-message" id="phoneError"></div>
                </div>

                <div class="form-group">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" required>
                    <div class="error-message" id="nomeError"></div>
                </div>

                <div class="form-group">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" required>
                    <div class="error-message" id="senhaError"></div>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" class="form-check-input" id="smsWhatsapp">
                    <label class="form-check-label" for="smsWhatsapp">
                        Aceito que entrem em contato comigo por SMS e WhatsApp.
                    </label>
                </div>

                <button type="submit" class="btn btn-continuar">Continuar</button>
            </form>
        </div>
    </main>

    <footer class="rodape mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2025 Cristian Gadelha, João Beraldo, Pedro Henrique</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Telefone
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 2) {
                value = `(${value.slice(0,2)}) ${value.slice(2)}`;
            }
            if (value.length > 10) {
                value = `${value.slice(0,10)}-${value.slice(10)}`;
            }
            e.target.value = value;
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
            
            let isValid = true;
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const nome = document.getElementById('nome');
            const senha = document.getElementById('senha');
            
           
            if (!email.value.trim() || !email.value.includes('@')) {
                document.getElementById('emailError').textContent = 'Por favor, insira um e-mail válido';
                document.getElementById('emailError').style.display = 'block';
                email.classList.add('is-invalid');
                isValid = false;
            }
            
            
            if (!phone.value.trim() || phone.value.replace(/\D/g, '').length < 10) {
                document.getElementById('phoneError').textContent = 'Por favor, insira um telefone válido';
                document.getElementById('phoneError').style.display = 'block';
                phone.classList.add('is-invalid');
                isValid = false;
            }
            
            
            if (!nome.value.trim()) {
                document.getElementById('nomeError').textContent = 'Por favor, insira seu nome';
                document.getElementById('nomeError').style.display = 'block';
                nome.classList.add('is-invalid');
                isValid = false;
            }
            
            
            if (!senha.value || senha.value.length < 6) {
                document.getElementById('senhaError').textContent = 'A senha deve ter pelo menos 6 caracteres';
                document.getElementById('senhaError').style.display = 'block';
                senha.classList.add('is-invalid');
                isValid = false;
            }
            
            if (isValid) {
                // Cadastro bem-sucedido
                alert('Cadastro realizado com sucesso!');
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
