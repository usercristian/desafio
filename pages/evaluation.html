<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            background: #f9f9f9;
        }

        .header {
            max-width: 100%;
        }

        .container-main {
            display: flex;
            flex-direction: column;
            justify-self: center;
            justify-content: center;
            align-items: center;
            align-self: center;
            background: #fff;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            gap: 30px;
            flex-grow: 1;
        }

        .form-avaliacao {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;

        }

        .bloco-avaliacao {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .produto-img {
            width: 220px;
            border-radius: 15px;
            object-fit: cover;
            border: 1px solid #d1f7ff;
            box-shadow: 0 4px 12px rgba(5, 217, 232, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .avaliacao {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: left;
            gap: 10px;
        }

        .titulo {
            margin-bottom: 20px;
        }

        .pergunta {
            font-weight: bold;
            margin: 0;
        }

        .estrelas {
            display: flex;
            gap: 10px;
            font-size: 40px;
            color: #00bcd4;
            cursor: pointer;
        }

        .estrela {
            transition: color 0.2s ease;
        }

        .estrela.preenchida {
            color: #00bcd4;
        }

        .formulario {
            grid-area: formulario;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .form-label {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px;
        }

        .form-label label {
            font-weight: bold;
            margin-bottom: 0px;
            color: #000;
        }

        .input-file-label {
            display: flex;
            ;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid #00bcd4;
            border-radius: 10px;
            color: #00bcd4;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 0;
            transition: 0.3s;
        }

        .input-file-label:hover {
            background-color: #e0f7fa;
        }

        textarea {
            border: 2px solid #00bcd4;
            border-radius: 10px;
            padding: 10px;
            resize: both;
            min-height: 100px;
            outline: none;
            font-family: inherit;
        }

        .icon-camera {
            width: 18px;
            height: 18px;
            color: #00bcd4;
        }

        .botao {
            margin-top: 20px;
            padding: 12px 24px;
            background: rgba(255, 42, 109, 0.5);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: not-allowed;
            transition: background 0.3s, cursor 0.3s;
        }

        .botao.ativo {
            cursor: pointer;
            background: #ff2a6d;
        }

        .botao.ativo:hover {
            background: #e02460;
        }

        .divisor {
            width: 100%;
            border: 1px 1000 #ccc;
            margin: 40px 0px;
        }


        .file-info {
            margin-top: 0.3rem;
            font-size: 0.9rem;
            color: #555;
        }

        .char-counter {
            text-align: right;
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.3rem;
        }

        @media (max-width: 768px) {
            .bloco-avaliacao {
                flex-direction: column;
                align-items: center;
                gap: 20px
            }

            .produto-img {
                width: 100%;
                justify-self: center;
                margin-bottom: 10px;
            }

            .formulario {
                width: 100%;
            }

            .botao {
                justify-self: center;
                width: 100%;
            }
        }
    </style>

</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
            <div class="container d-flex align-items-center">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/logo.png" alt="Happy Game Logo">
                    <span class="logo-text">Happy Game</span>
                </a>
                <div class="text-center w-100">
                    <h2 style="color: #d1f7ff; margin: 0;">Avaliação</h2>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-main">
        <form class="form-avaliacao" id="form-avaliacao">
            <div class="bloco-avaliacao">
                <img class="produto-img" src="/images/Teclado.3.png" alt="Teclado gamer mecânico RAZER">

                <div class="avaliacao">
                    <h3 class="titulo">Teclado gamer mecânico RAZER</h3>
                    <p class="pergunta"><strong>Qual sua avaliação desta compra?</strong></p>

                    <div class="estrelas" id="estrelas">
                        <i class="fa-regular fa-star estrela" data-valor="1"></i>
                        <i class="fa-regular fa-star estrela" data-valor="2"></i>
                        <i class="fa-regular fa-star estrela" data-valor="3"></i>
                        <i class="fa-regular fa-star estrela" data-valor="4"></i>
                        <i class="fa-regular fa-star estrela" data-valor="5"></i>
                    </div>

                    <input type="hidden" id="nota" name="nota">
                </div>
            </div>

            <hr class="divisor">

            <div class="formulario">
                <form id="uploadForm" class="form-label">
                    <label for="foto">Envie fotos do produto</label>
                    <label for="foto" class="input-file-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            viewBox="0 0 24 24" class="icon-camera">
                            <path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm8-3h-2.586l-1.707-1.707A1 1 0 0 0 15 4h-6a1 1 0 0 0-.707.293L6.586 6H4a2 2 0 0 0-2 2v10
        a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" />
                        </svg>
                        Enviar fotos
                        <input type="file" accept="image/*" id="foto" class="input-foto" multiple hidden>
                    </label>
                    <div id="fileName" class="file-info"></div>
                </form>
                <p id="message" style="margin: 0;"></p>

                <div class="form-label">
                    <label for="opiniao">Escreva sua opinião sobre o produto</label>
                    <textarea id="opiniao" maxlength="1000" name="opiniao" placeholder="O produto me..."></textarea>
                    <div id="charCount" class="char-counter">0/1000</div>
                </div>

                <button id="botao" class="botao" disabled>Publicar opinião</button>
            </div>
        </form>

    </main>
    <script>
        const estrelas = document.querySelectorAll('.estrela');
        const botao = document.getElementById('botao');
        const notaInput = document.getElementById('nota');
        const form = document.getElementById('form-avaliacao');

        let nota = 0; // valor inicial

        estrelas.forEach((estrela, index) => {
            estrela.addEventListener('click', () => {
                nota = index + 1;
                notaInput.value = nota;

                estrelas.forEach((e, i) => {
                    if (i <= index) {
                        e.classList.replace('fa-regular', 'fa-solid');
                    } else {
                        e.classList.replace('fa-solid', 'fa-regular');
                    }
                });

                // Ativa o botão
                botao.disabled = false;
                botao.classList.add('ativo');
            });
        });

        // captura do envio do formulário
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // impede o envio real por enquanto

            const dados = {
                nota: notaInput.value,
                opiniao: document.getElementById('opiniao').value
            };
        });

        const foto = document.getElementById('foto');
        const uploadForm = document.getElementById("uploadForm");
        const message = document.getElementById("message");

        const MAX_FILES = 3;

        foto.addEventListener("change", () => {
            if (foto.files.length > MAX_FILES) {
                message.textContent = `Você só pode selecionar até ${MAX_FILES} arquivos.`;
                foto.value = ""; // limpa a seleção
            } else {
                message.textContent = `${foto.files.length} arquivo(s) selecionado(s).`;
            }
        });

        form.addEventListener("submit", (e) => {
            if (foto.files.length > MAX_FILES) {
                e.preventDefault();
                alert(`Limite de ${MAX_FILES} arquivos excedido!`);
            }
        });

        // Exibir nome do arquivo selecionado
        const fileName = document.getElementById('fileName');

        foto.addEventListener('change', () => {
            if (foto.files.length > 0) {
                const validFiles = Array.from(foto.files).filter(file => file.type.startsWith('image/'));
                if (validFiles.length === 0) {
                    alert("Apenas arquivos de imagem são permitidos (jpg, png, gif, etc).");
                }

                const names = validFiles.map(file => file.name).join(", ");
                fileName.textContent = validFiles.length
                    ? `Imagens selecionadas: ${names}`
                    : "";
            } else {
                fileName.textContent = "";
            }
        }
        );





        // Atualizar contador de caracteres
        const opiniao = document.getElementById('opiniao');
        const charCount = document.getElementById('charCount');

        opiniao.addEventListener('input', () => {
            const length = opiniao.value.length;
            const maxLength = opiniao.getAttribute('maxlength');
            charCount.textContent = `${length}/${maxLength}`;
        });

    </script>

</body>

</html>
