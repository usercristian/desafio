<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avaliação do produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg custom-navbar position-relative">
            <div class="container position-relative">
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <img src="../images/logo.png" alt="Happy Game" height="40" />
                    <span class="logo-text ms-2">Happy Game</span>
                </a>

                <h2 class="page-title">Avaliação</h2>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 920px;">
        <form id="form-avaliacao" class="card-surface form-section">

            <div class="d-flex flex-column flex-md-row gap-4 align-items-start">
                <img src="../images/Teclado.3.png" alt="Teclado" class="produto-img" />

                <div style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
                    <h5 class="mb-2">Teclado gamer mecânico RAZER</h5>
                    <h4 class="mb-2"><strong>Qual sua avaliação desta compra?</strong></h4>

                    <div id="estrelas" class="avaliacao-stars" role="radiogroup" aria-label="Avaliação do produto">
                        <i class="fa-regular fa-star estrela" data-valor="1" role="radio" aria-checked="false"
                            tabindex="0"></i>
                        <i class="fa-regular fa-star estrela" data-valor="2" role="radio" aria-checked="false"
                            tabindex="0"></i>
                        <i class="fa-regular fa-star estrela" data-valor="3" role="radio" aria-checked="false"
                            tabindex="0"></i>
                        <i class="fa-regular fa-star estrela" data-valor="4" role="radio" aria-checked="false"
                            tabindex="0"></i>
                        <i class="fa-regular fa-star estrela" data-valor="5" role="radio" aria-checked="false"
                            tabindex="0"></i>
                    </div>

                    <input type="hidden" id="nota" name="nota" />
                </div>
            </div>

            <div class="form-section">
                <label class="fw-bold">Envie fotos do produto</label>
                <label for="foto" class="input-file-label d-inline-flex align-items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path d="M20 5h-3.17l-1.41-1.41A2 2 0 0 0 14.17 3H9.83a2 2 0 0 0-1.41.59L7 5H4a2 2 0 0 0-2 2v12
             a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-8 13a5 5 0 1 1 0-10
             5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" />
                    </svg>
                    Enviar fotos
                    <input type="file" id="foto" accept="image/*" multiple hidden />
                </label>

                <div id="fileName" class="file-info"></div>
            </div>

            <div class="form-section">
                <label for="opiniao" class="fw-bold">Escreva sua opinião</label>
                <textarea id="opiniao" name="opiniao" maxlength="1000" class="form-control"
                    placeholder="O produto me..."></textarea>
                <div id="charCount" class="char-counter text-end">0/1000</div>
            </div>

            <div class="text-center">
                <button id="botao" class="btn-principal" disabled>Publicar opinião</button>
            </div>
        </form>
        
        <div id="mensagem-sucesso" class="mensagem-sucesso flex-column" hidden>
            <div class="mensagem-conteudo">
                <i class="fa-solid fa-circle-check"></i>
                <p>Obrigado! Sua avaliação foi enviada com sucesso.</p>
            </div>
            <a href="../index.html" class="btn btn-outline-dark mt-3">Voltar às compras</a>
        </div>
        </main>

    <footer class="rodape mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <p class="mb-0">&copy; 2025 Cristian Gadelha, João Beraldo, Pedro Henrique</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <h5 class="sitemap-title mb-1">Mapa do Site</h5>
                    <ul class="sitemap-list mb-0">
                        <li><a href="../index.html">Início</a></li>
                        <li><a href="../pages/info.html">Informações</a></li>
                        <li><a href="../pages/form.html">Contato</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const estrelas = document.querySelectorAll('.estrela');
        const botao = document.getElementById('botao');
        const notaInput = document.getElementById('nota');
        const form = document.getElementById('form-avaliacao');
        let nota = 0;

        estrelas.forEach((estrela, index) => {
            estrela.addEventListener('click', () => {
                nota = index + 1;
                notaInput.value = nota;
                atualizarEstrelas(index);
                habilitarBotao();
            });
            estrela.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    estrela.click();
                }
            });
        });

        function atualizarEstrelas(index) {
            estrelas.forEach((e, i) => {
                if (i <= index) {
                    e.classList.replace('fa-regular', 'fa-solid');
                    e.setAttribute('aria-checked', 'true');
                } else {
                    e.classList.replace('fa-solid', 'fa-regular');
                    e.setAttribute('aria-checked', 'false');
                }
            });
        }

        function habilitarBotao() {
            botao.disabled = false;
            botao.classList.add('ativo');
        }

        form.addEventListener('submit', (ev) => {
            ev.preventDefault();

            console.log({
                nota: notaInput.value,
                opiniao: document.getElementById('opiniao').value
            });

            const msg = document.getElementById('mensagem-sucesso');
            msg.hidden = false;
            msg.scrollIntoView({ behavior: 'smooth' });

            form.reset();
            nota = 0;
            atualizarEstrelas(-1);
            botao.disabled = true;
        });

        const foto = document.getElementById('foto');
        const fileName = document.getElementById('fileName');
        const MAX_FILES = 3;

        foto.addEventListener('change', () => {
            if (foto.files.length > MAX_FILES) {
                alert(`Você só pode selecionar até ${MAX_FILES} arquivos.`);
                foto.value = '';
                fileName.textContent = '';
                return;
            }
            const names = Array.from(foto.files).map(f => f.name).join(', ');
            fileName.textContent = names ? `Imagens selecionadas: ${names}` : '';
        });

        const opiniao = document.getElementById('opiniao');
        const charCount = document.getElementById('charCount');
        opiniao.addEventListener('input', () => {
            charCount.textContent = `${opiniao.value.length}/${opiniao.getAttribute('maxlength')}`;
        });
    </script>
</body>

</html>
